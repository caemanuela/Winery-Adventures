[project]
name = "winery-adventures"
version = "0.1.0"
description = "HPC pipeline for winery analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=0.20.0",
    "numba==0.59.1",
    "numpy>=1.26.0,<2.0.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "joblib>=1.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["winery_adventures"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true