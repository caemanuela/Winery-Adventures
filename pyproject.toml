[project]
name = "winery-adventures"
version = "0.1.2"
description = "HPC pipeline for winery analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=0.20.0",
    "numba==0.59.1",
    "numpy>=1.26.0,<2.0.0",
    "wandb>=0.16.0",
    "joblib>=1.3.0",
    "tqdm",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["winery_adventures"]

[tool.ruff]
line-length = 88
exclude = ["docs/reports", "reports", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=winery_adventures",
    "--cov-report=term-missing",
    "--cov-report=html:docs/reports/coverage_html",
    "--cov-report=xml:docs/reports/coverage.xml",
    "--junitxml=docs/reports/junit_report.xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["winery_adventures"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
